# PostgreSQL 18 para desenvolvimento local (RLS multi-tenant depende de PG 18 — uuidv7()).
# Sobe só o banco; backend e frontends rodam via `npx nx serve` (ver README → "Rodar localmente").
#
#   docker compose up -d        # sobe o Postgres 18 em localhost:5432
#   docker compose down         # para (mantém o volume/dados)
#   docker compose down -v      # para e APAGA os dados (reset limpo)
services:
  db:
    image: postgres:18-alpine
    container_name: cozinha81-db
    environment:
      POSTGRES_USER: admin          # papel ADMIN/owner: roda migrations e seed
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cozinha81
    ports:
      - "5432:5432"
    volumes:
      - cozinha81-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cozinha81"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cozinha81-pgdata:
