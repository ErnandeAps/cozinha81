<!-- @dsCard group="Brand" viewport="700x200" name="Voice & tone" subtitle="Direto, capaz, pé no chão — sem hype" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display: flex; gap: 18px; }
  .col { flex: 1; }
  .h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
  .yes { color: var(--ready-700); }
  .no { color: var(--stop-700); }
  .line { font-size: 14px; line-height: 1.5; padding: 7px 0; border-top: 1px solid var(--border-subtle); color: var(--text-primary); }
  .line.bad { color: var(--text-muted); text-decoration: line-through; }
</style>
</head>
<body>
  <div class="col">
    <div class="h yes">✓ Soa como</div>
    <div class="line">"Sua cozinha já está acesa."</div>
    <div class="line">"Sem obra, sem CAPEX, sem dor."</div>
    <div class="line">"Chegue, cozinhe, despache."</div>
  </div>
  <div class="col">
    <div class="h no">✗ Evite</div>
    <div class="line bad">"Soluções sinérgicas de food-tech."</div>
    <div class="line bad">"Revolucione seu negócio agora!!!"</div>
    <div class="line bad">"A melhor cozinha do mundo 🚀🔥"</div>
  </div>
</body>
</html>
