<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--flame-200); border-radius: var(--radius-xs); width: 100%; }
  .bar.big { background: var(--flame-400); }
  .cell { width: 44px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 6px; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="scale">
    <div class="item cell"><div class="bar" style="height:4px"></div><div class="lbl">1</div><div class="val">4</div></div>
    <div class="item cell"><div class="bar" style="height:8px"></div><div class="lbl">2</div><div class="val">8</div></div>
    <div class="item cell"><div class="bar" style="height:12px"></div><div class="lbl">3</div><div class="val">12</div></div>
    <div class="item cell"><div class="bar" style="height:16px"></div><div class="lbl">4</div><div class="val">16</div></div>
    <div class="item cell"><div class="bar" style="height:24px"></div><div class="lbl">6</div><div class="val">24</div></div>
    <div class="item cell"><div class="bar big" style="height:32px"></div><div class="lbl">8</div><div class="val">32</div></div>
    <div class="item cell"><div class="bar big" style="height:48px"></div><div class="lbl">12</div><div class="val">48</div></div>
    <div class="item cell"><div class="bar big" style="height:64px"></div><div class="lbl">16</div><div class="val">64</div></div>
    <div class="item cell"><div class="bar big" style="height:80px"></div><div class="lbl">20</div><div class="val">80</div></div>
  </div>
</body>
</html>
