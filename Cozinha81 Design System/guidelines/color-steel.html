<!-- @dsCard group="Colors" viewport="700x150" name="Steel neutrals" subtitle="Warm grays — stainless steel + warm light" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  /* Self-contained: literal token values so the card renders even if the
     external stylesheet is unavailable in a sandboxed card iframe. */
  body { margin: 0; padding: 20px; background: #FFFFFF; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
  .row { display: flex; gap: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(26,26,26,.08); border: 1px solid #E0E0E0; }
  .sw { flex: 1; height: 84px; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; }
  .meta { display: flex; gap: 16px; margin-top: 12px; }
  .meta div { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #6B6B6B; }
  .meta b { color: #1A1A1A; font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#FFFFFF"><span style="color:#565350">0</span></div>
    <div class="sw" style="background:#FAFAFA"><span style="color:#565350">25</span></div>
    <div class="sw" style="background:#F5F4F1"><span style="color:#565350">50</span></div>
    <div class="sw" style="background:#ECEAE5"><span style="color:#565350">100</span></div>
    <div class="sw" style="background:#E0E0E0"><span style="color:#3D3B39">200</span></div>
    <div class="sw" style="background:#C2BEB5"><span style="color:#2A2826">300</span></div>
    <div class="sw" style="background:#9B968C"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:#74706A"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:#565350"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:#3D3B39"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:#2A2826"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:#1A1A1A"><span style="color:#fff">900</span></div>
  </div>
  <div class="meta">
    <div>Ink&nbsp; <b>--ink · #1A1A1A</b></div>
    <div>Page&nbsp; <b>--bg-off · #FAFAFA</b></div>
    <div>Border&nbsp; <b>--border · #E0E0E0</b></div>
  </div>
</body>
</html>
